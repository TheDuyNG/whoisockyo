services:
  postgres:
    image: postgres:17-alpine
    container_name: whoisockyo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: whoisockyo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - whoisockyo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d whoisockyo']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  whoisockyo-postgres-data:
